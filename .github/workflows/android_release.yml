name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATES_VERSION: 4.7.2.stable
  GODOT_EDITOR_SETTINGS_VERSION: "4.7"
  BUNDLETOOL_VERSION: 1.17.2

jobs:
  export-android:
    name: Build Android App Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}."
            exit 1
          fi
          set +o pipefail
          yes | "${SDKMANAGER}" --licenses
          set -o pipefail
          "${SDKMANAGER}" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Download and Install Godot
        run: |
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip "Godot_v${GODOT_VERSION}_linux.x86_64.zip" -d /tmp
          sudo mv "/tmp/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}"
          wget "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp
          mv /tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}/"

      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkey -v -keystore game/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storepass android -keypass android

      - name: Import Assets
        run: godot --headless --path ./game --editor --quit

      - name: Run Headless Tests
        run: godot --headless --path ./game -s res://tests/test_runner.gd

      - name: Configure Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-${GODOT_EDITOR_SETTINGS_VERSION}.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/game/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android Build Template
        run: |
          mkdir -p game/android/build
          unzip -q $HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_VERSION}/android_source.zip -d game/android/build
          echo "${GODOT_TEMPLATES_VERSION}" > game/android/.build_version
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "game/android/build/gradlew" ]; then
            chmod +x game/android/build/gradlew
          fi

      - name: Export Android AAB
        run: godot --verbose --headless --path ./game --export-release "Android" Sudoku.aab

      - name: Decode Release Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Sign App Bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ./game
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEYSTORE_ALIAS || secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.1.0"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Android
          path: |
            ./game/*.aab
            ./game/*-native-debug-symbols.zip
            ./game/android/build/outputs/mapping/release/mapping.txt

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./game/*.aab
            ./game/*-native-debug-symbols.zip
            ./game/android/build/outputs/mapping/release/mapping.txt





